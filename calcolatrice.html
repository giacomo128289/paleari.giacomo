<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Calcolatrice</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 260px; }
        input { width: 90%; padding: 10px; margin-bottom: 10px; text-align: right; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 10px; }
        button { padding: 12px; font-size: 16px; cursor: pointer; font-weight: bold; background: #f0f0f0; border: 1px solid #ccc; }
        .active { background: #4a90e2; color: white; }
        .btn-eq { width: 100%; background: #2ecc71; color: white; margin-bottom: 10px; }
        #res { padding: 10px; background: #eee; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <input type="text" id="n1" placeholder="Num 1">
    <input type="text" id="n2" placeholder="Num 2">

    <div class="grid">
        <button onclick="sel('+', this)">+</button>
        <button onclick="sel('-', this)">-</button>
        <button onclick="sel('*', this)">*</button>
        <button onclick="sel('/', this)">/</button>
    </div>

    <button class="btn-eq" onclick="calcola()">=</button>
    <div id="res">Risultato: -</div>
</div>

<script>
    let op = null;
    let btnAttivo = null;

    function sel(valore, btn) {
        op = valore;
        
        if (btnAttivo) btnAttivo.className = ''; 
      
        btn.className = 'active';
        btnAttivo = btn;
    }

    function calcola() {
        let v1 = parseFloat(document.getElementById('n1').value);
        let v2 = parseFloat(document.getElementById('n2').value);
        let out = document.getElementById('res');
        let r = 0;

        switch (op) {
            case '+': r = v1 + v2; break;
            case '-': r = v1 - v2; break;
            case '*': r = v1 * v2; break;
            case '/': r = v1 / v2; break;
            default: r = "Seleziona operazione";
        }

        out.innerHTML = "Risultato: " + r;
    }
</script>

</body>
</html>
