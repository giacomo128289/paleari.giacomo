
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Semi-Calcolatrice</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; background: #f4f4f9; margin: 0; }
    .calculator { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 280px; text-align: center; }
    input { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; text-align: right; }
    .btns { display: flex; gap: 5px; margin: 10px 0; }
    button { flex: 1; padding: 10px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 5px; font-weight: bold; }
    button.active { background: #007bff; color: #fff; }
    .btn-eq { width: 100%; background: #28a745; color: #fff; }
    #res { margin-top: 15px; font-weight: bold; background: #eee; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body>

<div class="calculator">
  <h3>Semi-Calcolatrice</h3>
  <input type="text" id="n1" placeholder="Primo numero">
  <input type="text" id="n2" placeholder="Secondo numero">
  
  <div class="btns">
    <button class="op" onclick="setOp('+')">+</button>
    <button class="op" onclick="setOp('-')">-</button>
    <button class="op" onclick="setOp('*')">&times;</button>
    <button class="op" onclick="setOp('/')">&divide;</button>
  </div>

  <button class="btn-eq" onclick="calcola()">=</button>
  <div id="res">Risultato: --</div>
</div>

<script>
  let op = null;

  function setOp(o) {
    op = o;
    document.querySelectorAll('.op').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
  }

  function calcola() {
    const a = parseFloat(document.getElementById('n1').value);
    const b = parseFloat(document.getElementById('n2').value);
    const out = document.getElementById('res');

    if (isNaN(a) || isNaN(b)) return out.textContent = "Inserisci due numeri!";
    if (!op) return out.textContent = "Scegli un'operazione!";
    if (op === '/' && b === 0) return out.textContent = "Impossibile div per 0!";

    const operazioni = { '+': a + b, '-': a - b, '*': a * b, '/': a / b };
    out.textContent = "Risultato: " + Math.round(operazioni[op] * 10000) / 10000;
  }
</script>

</body>
</html>
